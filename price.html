<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>たぬき開発 - 料金表</title>
    <style>
        body {
            background-color: #f0f7e6;
            color: #4a3a2b;
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
        }
        .price-board {
            background-color: #ffffff;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 20px;
            border: 4px solid #8fc27c;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            animation: slideDown 0.6s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            color: #568246;
            border-bottom: 2px dashed #8fc27c;
            padding-bottom: 10px;
        }
        /* ▼ 表（テーブル）のデザイン ▼ */
        table {
            width: 100%;
            border-collapse: collapse; /* 枠線を1本にまとめる */
            margin-top: 20px;
            margin-bottom: 30px;
        }
        th, td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #faf5eb;
            color: #d18a38;
        }
        /* ▼ 戻るボタンのデザイン ▼ */
        .back-button {
            display: inline-block;
            background-color: #8fc27c;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .back-button:hover {
            background-color: #568246;
        }
    </style>
</head>
<body>
    <div class="price-board">
        <h1>💰 マイホーム建築プラン</h1>
        <p>お客さまにぴったりのプランをご用意しているだなも！</p>
        
        <!-- ▼ 料金表（テーブル）の作成 ▼ -->
        <table>
            <tr>
                <th>プラン名</th>
                <th>料金</th>
            </tr>
            <tr>
                <td>移住パッケージ（テント）</td>
                <td>5,000 マイル</td>
            </tr>
            <tr>
                <td>マイホーム建設（初期）</td>
                <td>98,000 ベル</td>
            </tr>
            <tr>
                <td>お部屋の拡張（1回目）</td>
                <td>198,000 ベル</td>
            </tr>
            <tr>
                <td>奥のお部屋を追加</td>
                <td>348,000 ベル</td>
            </tr>
        </table>

        <!-- 最初のページに戻るリンク -->
        <a href="index.html" class="back-button">⬅️ たぬきちのページに戻る</a>
    </div>
</body>
</html>
